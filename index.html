function getConfig(Z){
  if(EXCEPT[Z]) return EXCEPT[Z].map(([n,l,c])=>({n,l,c}));
  let rem=Z; const cfg=[];
  for(const [n,l,max] of AUFBAU){
    if(rem<=0) break;
    const c=Math.min(rem,max); cfg.push({n,l,c}); rem-=c;
  }
  return cfg;
}

function fmtConfig(cfg){
  return [...cfg].sort((a,b)=>a.n-b.n||a.l-b.l)
    .map(({n,l,c})=>`${n}${LS[l]}${SUP[c]||c}`).join(' ');
}

// Return orbitals sorted by n then l (natural chemistry order)
function getOrbitals(cfg){
  return [...cfg].sort((a,b)=>a.n-b.n||a.l-b.l).map(({n,l})=>`${n}${LS[l]}`);
}

// ─── SLATER'S RULES ENGINE ───────────────────────────────
function slater(cfg, orbital){
  const n=parseInt(orbital[0]);
  const lc=orbital[1];
  const l=LS.indexOf(lc);
  const tgt=cfg.find(c=>c.n===n && c.l===l);
  if(!tgt) return null;

  const steps=[];
  let S=0;

  if(lc==='s'||lc==='p'){
    // Slater's [ns,np] group: only s and p of SAME n count (not nd or nf)
    // Exclude the electron under consideration
    const sameShell=cfg.filter(c=>c.n===n && (c.l===0||c.l===1)).reduce((acc,c)=>{
      if(c.l===l) return acc+c.c-1; // same subshell: exclude self
      return acc+c.c;              // other sp of same n (e.g. 2p for a 2s electron)
    },0);
    const sigma=(n===1)?0.30:0.35;
    const v_same=parseFloat((sameShell*sigma).toFixed(2));
    S+=v_same;
    steps.push({
      label:`Same [${n}s,${n>1?n+'p':'1s'}] Group`,
      detail: sameShell>0
        ? `${sameShell} other electron${sameShell>1?'s':''} × ${sigma}`
        : `0 other electrons × ${sigma} (only electron in this group)`,
      val:v_same,
      col:'cyan'
    });

    // (n-1) shell → 0.85 (includes ns, np, nd, nf of shell n-1)
    if(n>1){
      const nm1=cfg.filter(c=>c.n===n-1).reduce((a,c)=>a+c.c,0);
      const v_nm1=parseFloat((nm1*0.85).toFixed(2));
      S+=v_nm1;
      steps.push({
        label:`Shell n − 1 (n = ${n-1})`,
        detail: nm1>0
          ? `${nm1} electron${nm1>1?'s':''} × 0.85`
          : `0 electrons in shell ${n-1}`,
        val:v_nm1,
        col:'blue'
      });
    }

    // (n-2) and lower shells → 1.00 each
    if(n>2){
      const inner=cfg.filter(c=>c.n<=n-2).reduce((a,c)=>a+c.c,0);
      const v_in=parseFloat((inner*1.00).toFixed(2));
      S+=v_in;
      steps.push({
        label:`Inner Shells (n ≤ ${n-2})`,
        detail: inner>0
          ? `${inner} electron${inner>1?'s':''} × 1.00`
          : `0 electrons in shells ≤ ${n-2}`,
        val:v_in,
        col:'purple'
      });
    }

    // Outer electrons (higher n or higher Slater group) → 0.00 (no shielding)
    const outer=cfg.filter(c=>c.n>n || (c.n===n && c.l>1)).reduce((a,c)=>a+c.c,0);
    if(outer>0){
      steps.push({
        label:`Outer Groups (outside [${n}s,${n>1?n+'p':'1s'}] in Slater order)`,
        detail:`${outer} electron${outer>1?'s':''} × 0.00 (no shielding)`,
        val:0.00,
        col:'slate'
      });
    }

  } else {
    // ── d or f electron ──
    // Slater's rules: same group → 0.35; all groups to the LEFT in
    // Slater's canonical order → 1.00; groups to the right → 0.00
    const same=tgt.c-1;
    const v_same=parseFloat((same*0.35).toFixed(2));
    S+=v_same;
    steps.push({
      label:`Same [${n}${lc}] Group`,
      detail: same>0
        ? `${same} other electron${same>1?'s':''} × 0.35`
        : `0 other electrons × 0.35 (only electron in this orbital)`,
      val:v_same,
      col:'cyan'
    });

    // Find this orbital's position in Slater's canonical order
    const myIdx=SLATER_DF.findIndex(([an,al])=>an===n && al===l);
    let left=0;
    for(let i=0;i<myIdx;i++){
      const [an,al]=SLATER_DF[i];
      const f=cfg.find(c=>c.n===an && c.l===al);
      if(f) left+=f.c;
    }
    const v_left=parseFloat((left*1.00).toFixed(2));
    S+=v_left;
    steps.push({
      label:`Inner Groups (to the left in Slater order)`,
      detail: left>0
        ? `${left} electron${left>1?'s':''} × 1.00`
        : `0 inner electrons × 1.00`,
      val:v_left,
      col:'purple'
    });

    // Groups to the right in Slater's canonical order → contribute 0.00
    let right=0;
    for(let i=myIdx+1;i<SLATER_DF.length;i++){
      const [an,al]=SLATER_DF[i];
      const f=cfg.find(c=>c.n===an && c.l===al);
      if(f) right+=f.c;
    }
    if(right>0){
      steps.push({
        label:`Outer Groups (to the right in Slater order)`,
        detail:`${right} electron${right>1?'s':''} × 0.00 (outside Slater group, no shielding)`,
        val:0.00,
        col:'slate'
      });
    }
  }

  S=parseFloat(S.toFixed(2));
  return {S, steps};
}

// ─── PERIODIC TABLE GRID LAYOUT ──────────────────────────
function buildGrid(){
  const grid={};
  // Main group elements
  const main=ELEMENTS.filter(e=>!e.lrow);
  main.forEach(e=>{
    if(!grid[e.p]) grid[e.p]={};
    grid[e.p][e.g]=e;
  });
  // Lanthanides → row 9, cols 3..17
  const lans=ELEMENTS.filter(e=>e.lrow===1);
  lans.forEach((e,i)=>{
    if(!grid[9]) grid[9]={};
    grid[9][i+3]=e;
  });
  // Actinides → row 10, cols 3..17
  const acts=ELEMENTS.filter(e=>e.lrow===2);
  acts.forEach((e,i)=>{
    if(!grid[10]) grid[10]={};
    grid[10][i+3]=e;
  });
  return grid;
}
const PT_GRID=buildGrid();

// ─── GAUGE RING ──────────────────────────────────────────
function Gauge({label,value,max,c1,c2,size=108}){
  const r=(size-16)/2;
  const circ=2*Math.PI*r;
  const pct=Math.min(value/Math.max(max,1),1);
  const dash=pct*circ;
  const gid=`g${label}`;
  return(
    <div className="flex flex-col items-center gap-1">
      <svg width={size} height={size}>
        <defs>
          <linearGradient id={gid} x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor={c1}/>
            <stop offset="100%" stopColor={c2}/>
          </linearGradient>
        </defs>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth="8"/>
        <circle cx={size/2} cy={size/2} r={r} fill="none"
          stroke={`url(#${gid})`} strokeWidth="8" strokeLinecap="round"
          strokeDasharray={`${dash} ${circ-dash}`} strokeDashoffset={circ/4}
          style={{transition:'stroke-dasharray .8s ease'}}/>
        <text x={size/2} y={size/2-3} textAnchor="middle"
          fill={c1} fontSize={size*0.155} fontWeight="700" fontFamily="JetBrains Mono,monospace">
          {typeof value==='number'&&!Number.isInteger(value)?value.toFixed(2):value}
        </text>
        <text x={size/2} y={size/2+13} textAnchor="middle"
          fill="rgba(255,255,255,0.45)" fontSize={size*0.1} fontFamily="Inter,sans-serif">
          {label}
        </text>
      </svg>
    </div>
  );
}

// ─── RESULT TEXT BUILDER ─────────────────────────────────
function buildTxt(el,orb,Z,S,Zeff,steps){
  let t=`Albert & Einstein – Zeff Calculator\n${'='.repeat(38)}\n`;
  t+=`Element : ${el.name} (${el.sym})\n`;
  t+=`Atomic Z : ${Z}\nOrbital  : ${orb}\n\n`;
  t+=`Slater's Rules Breakdown:\n`;
  steps.forEach(s=>{ t+=`  ${s.label}: ${s.detail} = +${s.val.toFixed(2)}\n`; });
  t+=`\nShielding Constant  S    = ${S.toFixed(2)}\n`;
  t+=`Effective Nuc. Charge Zeff = ${Z} − ${S.toFixed(2)} = ${Zeff.toFixed(2)}\n`;
  return t;
}

  },[dark]);

  useEffect(()=>{ try{ localStorage.setItem('ae-hist',JSON.stringify(history)); }catch{} },[history]);
  useEffect(()=>{ try{ localStorage.setItem('ae-favs',JSON.stringify(favs)); }catch{} },[favs]);

  const cfg=useMemo(()=>sel?getConfig(sel.Z):[],[sel]);
  const orbs=useMemo(()=>getOrbitals(cfg),[cfg]);
  const cfgStr=useMemo(()=>fmtConfig(cfg),[cfg]);

  // When an element is selected, default to the outermost (valence) orbital and auto-calculate
  useEffect(()=>{
    if(sel && orbs.length){
      const valenceOrb = orbs[orbs.length - 1];
      setOrb(valenceOrb);
      const r = slater(cfg, valenceOrb);
      if(r){
        const Z=sel.Z, S=r.S, Zeff=parseFloat((Z-S).toFixed(2));
        setResult({Z,S,Zeff,steps:r.steps,orb:valenceOrb,el:sel});

    }
  },[sel]);

  function executeCalc(targetOrb){
    const useOrb = targetOrb || orb;
    if(!sel || !useOrb) return;
    const r=slater(cfg, useOrb);
    if(!r) return;
    const Z=sel.Z, S=r.S, Zeff=parseFloat((Z-S).toFixed(2));
    setOrb(useOrb);
    setResult({Z,S,Zeff,steps:r.steps,orb:useOrb,el:sel});
    setHistory(p=>{
      if(p.length>0){

        if(last.Z===sel.Z && last.orb===useOrb) return p;
      }
      return [...p.slice(-49),{Z,S,Zeff,orb:useOrb,sym:sel.sym,name:sel.name,steps:r.steps,el:sel,ts:new Date().toLocaleString()}];
    });

            <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-xl shadow-lg shadow-cyan-500/30">⚛</div>
            <div>
              <div className="font-black text-base leading-none bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">Albert &amp; Einstein</div>
              <div className={`text-xs ${dark?'text-white/45':'text-slate-500'}`}>Zeff Calculator</div>
            </div>
          </div>

          {/* Search – desktop */}
          <div className="flex-1 hidden sm:block max-w-sm">
            <div className="relative">
              <span className="absolute left-3 top-1/2 -translate-y-1/2 text-sm opacity-40">🔍</span>
              <input type="text" placeholder="Search by name, symbol or Z…"
                value={q} onChange={e=>setQ(e.target.value)}
                className={`w-full pl-9 pr-3 py-1.5 rounded-xl text-sm outline-none transition-all ${inp}`}/>
            </div>
          </div>

          <div className="ml-auto flex items-center gap-2">
            <button onClick={()=>setDark(d=>!d)}
              className={`p-2 rounded-xl transition-all text-lg ${dark?'bg-white/10 hover:bg-white/20':'bg-slate-100 hover:bg-slate-200'}`}
              title="Toggle theme">
              {dark?'☀️':'🌙'}
            </button>
          </div>
        </div>
        {/* Search – mobile */}
        <div className="sm:hidden px-4 pb-3">
          <div className="relative">
            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-sm opacity-40">🔍</span>
            <input type="text" placeholder="Search element…"
              value={q} onChange={e=>setQ(e.target.value)}
              className={`w-full pl-9 pr-3 py-1.5 rounded-xl text-sm outline-none transition-all ${inp}`}/>
          </div>
        </div>
      </header>

      <main className="max-w-[1400px] mx-auto px-4 py-6 space-y-5">

        {/* ── TABS ── */}
        <div className={`flex gap-1 rounded-2xl p-1 w-fit ${dark?'bg-white/5':'bg-slate-100'}`}>
          {[['table','🧪 Periodic Table'],['history','🕑 History'],['favorites','⭐ Favourites']].map(([k,lbl])=>(
            <button key={k} onClick={()=>setTab(k)}
              className={`px-4 py-2 rounded-xl text-sm font-semibold transition-all ${
                tab===k
                  ?'bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-lg shadow-cyan-500/25'
                  :dark?'text-white/55 hover:text-white':'text-slate-500 hover:text-slate-700'
              }`}>
              {lbl}
            </button>
          ))}
        </div>

        {/* ── PERIODIC TABLE TAB ── */}
        {tab==='table'&&(
          <div className="space-y-5 anim-fade">

            {/* Periodic Table Card */}
            <div className={`rounded-2xl p-4 ${card}`}>
              <div className="flex items-center justify-between mb-3">
                <h2 className="font-bold">
                  {sel ? `Selected: ${sel.name}` : '👆 Click any element to begin'}
                </h2>
                <span className={`text-xs ${dark?'text-white/40':'text-slate-400'}`}>118 elements</span>
              </div>
              {/* Main periodic table */}
              <div className="pt-scroll">
                <div className="flex flex-col gap-0.5" style={{minWidth:54*18}}>
                  {renderRows([1,2,3,4,5,6,7])}
                </div>
              </div>
              {/* f-block separator */}
              <div className="mt-3 mb-1 flex items-center gap-2">
                <div className={`flex-1 h-px ${dark?'bg-white/10':'bg-slate-200'}`}/>
                <span className={`text-xs ${dark?'text-white/30':'text-slate-400'}`}>Lanthanides & Actinides</span>
                <div className={`flex-1 h-px ${dark?'bg-white/10':'bg-slate-200'}`}/>
              </div>
              <div className="pt-scroll">
                <div className="flex flex-col gap-0.5" style={{minWidth:54*18}}>
                  {renderRows([9,10])}
                </div>
              </div>
              <Legend/>
            </div>

            {/* Element panel */}
            {sel?(
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">

                {/* LEFT: Element info + orbital selector */}
                <div className="space-y-4">

                  {/* Element Info Card */}
                  <div className={`rounded-2xl p-5 ${card} anim-up`}>
                    <div className="flex items-start gap-4">
                      {/* Big element tile */}
                      <div className={`el c-${sel.cat} flex-shrink-0`}
                           style={{width:80,height:80,borderRadius:14,fontSize:'inherit'}}>
                        <span style={{fontSize:10,opacity:.85}}>{sel.Z}</span>
                        <span style={{fontSize:30,fontWeight:900,lineHeight:1}}>{sel.sym}</span>
                        <span style={{fontSize:9,opacity:.7}}>{sel.name}</span>
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2">
                          <h2 className="font-black text-xl truncate">{sel.name}</h2>
                          <button onClick={toggleFav} className="text-xl flex-shrink-0 hover:scale-125 transition-transform" title={isFav?'Remove favourite':'Add favourite'}>
                            {isFav?'⭐':'☆'}
                          </button>
                        </div>
                        <p className={`text-sm ${dark?'text-white/55':'text-slate-500'}`}>
                          {sel.sym} &nbsp;·&nbsp; Z = {sel.Z} &nbsp;·&nbsp; {sel.cat.replace('-',' ')}
                        </p>
                        <div className={`mt-2 px-3 py-1.5 rounded-xl font-mono text-xs break-all leading-relaxed ${dark?'bg-white/10':'bg-slate-100 text-slate-700'}`}>
                          {cfgStr}
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Orbital Selector */}
                  <div className={`rounded-2xl p-5 ${card} anim-up`}>
                    <h3 className={`text-xs font-bold uppercase tracking-widest mb-3 ${dark?'text-white/40':'text-slate-400'}`}>
                      Step 2 — Choose an Orbital
                    </h3>

                    {/* Orbital quick-pick pills */}
                    <div className="flex flex-wrap gap-2 mb-3">
                      {orbs.map((o, idx)=>{
                        const isValence = idx === orbs.length - 1;
                        return (
                          <button key={o} onClick={()=>executeCalc(o)}
                            className={`px-3 py-1.5 rounded-lg font-mono text-sm font-semibold transition-all ${
                              orb===o
                                ?'bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-md shadow-cyan-500/30 ring-1 ring-cyan-300/50'
                                :dark?'bg-white/10 hover:bg-white/20 text-white/70':'bg-slate-100 hover:bg-slate-200 text-slate-600'
                            }`}
                            title={isValence ? `${o} (Valence Orbital)` : o}>
                            {o}
                            {isValence && <span className="ml-1 text-[9px] opacity-75 font-sans font-normal uppercase">val</span>}
                          </button>
                        );
                      })}
                    </div>

                    {/* Custom styled dropdown – no native select glitch */}
                    <OrbitalDropdown
                      orbs={orbs}
                      orb={orb}
                      dark={dark}
                      onSelect={o=>executeCalc(o)}
                    />

                    <button onClick={()=>executeCalc(orb)}
                      className="w-full py-3 rounded-xl font-bold text-lg bg-gradient-to-r from-cyan-500 to-blue-600 text-white hover:from-cyan-400 hover:to-blue-500 transition-all shadow-lg shadow-cyan-500/30 hover:shadow-cyan-500/50 hover:-translate-y-0.5 active:translate-y-0">
                      ⚡ Calculate Z<sub>eff</sub>
                    </button>
                  </div>
                </div>

                {/* RIGHT: Results panel */}
                <div>
                  {result?(
                    <div ref={resRef} className="space-y-4 anim-up">

                      {/* Gauge + numbers */}
                      <div className={`rounded-2xl p-5 ${card}`}>
                        <h3 className={`text-xs font-bold uppercase tracking-widest mb-4 ${dark?'text-white/40':'text-slate-400'}`}>Results</h3>
                        <div className="flex justify-around flex-wrap gap-3">
                          <Gauge label="Z" value={result.Z} max={118} c1="#3b82f6" c2="#1d4ed8"/>
                          <Gauge label="S" value={result.S} max={result.Z} c1="#8b5cf6" c2="#7c3aed"/>
                          <Gauge label="Zeff" value={result.Zeff} max={result.Z} c1="#06b6d4" c2="#0891b2"/>
                        </div>

                        {/* Value boxes */}
                        <div className="grid grid-cols-3 gap-3 mt-4">
                          {[
                            {l:'Z',v:result.Z,g:'from-blue-600 to-blue-800'},
                            {l:'S',v:result.S.toFixed(2),g:'from-purple-600 to-purple-800'},
                            {l:'Zeff',v:result.Zeff.toFixed(2),g:'from-cyan-500 to-cyan-700'},
                          ].map(x=>(
                            <div key={x.l} className={`rounded-xl p-3 bg-gradient-to-br ${x.g} text-white text-center shadow-lg`}>
                              <div className="font-mono font-black text-2xl">{x.v}</div>
                              <div className="text-xs opacity-75 mt-0.5">{x.l}</div>
                            </div>
                          ))}
                        </div>

                        {/* Formula */}
                        <div className={`mt-3 rounded-xl p-3 text-center ${dark?'bg-white/5':'bg-slate-50'}`}>
                          <span className="font-mono text-base font-bold">
                            Z<sub>eff</sub> = {result.Z} − {result.S.toFixed(2)} = <span className="text-cyan-400">{result.Zeff.toFixed(2)}</span>
                          </span>
                        </div>
                      </div>

                      {/* Step-by-step */}
                      <div className={`rounded-2xl p-5 ${card}`}>
                        <h3 className={`text-xs font-bold uppercase tracking-widest mb-3 ${dark?'text-white/40':'text-slate-400'}`}>
                          📐 Step-by-Step Slater's Rules
                        </h3>
                        <div className={`mb-3 rounded-xl px-4 py-2.5 text-sm ${dark?'bg-cyan-500/10 text-cyan-300 border border-cyan-500/20':'bg-cyan-50 text-cyan-700 border border-cyan-200'}`}>
                          Electron in <span className="font-mono font-bold">{result.orb}</span> of <span className="font-semibold">{result.el.name}</span>
                          {' '}<span className={dark?'text-white/40':'text-slate-400'}>({result.el.sym})</span>
                        </div>

                        <div className="space-y-2">
                          {result.steps.map((st,i)=>{
                            const cm={
                              cyan:{bg:dark?'rgba(6,182,212,0.1)':'rgba(6,182,212,0.08)',brd:'rgba(6,182,212,0.3)',tx:'#06b6d4'},
                              blue:{bg:dark?'rgba(59,130,246,0.1)':'rgba(59,130,246,0.08)',brd:'rgba(59,130,246,0.3)',tx:'#3b82f6'},
                              purple:{bg:dark?'rgba(139,92,246,0.1)':'rgba(139,92,246,0.08)',brd:'rgba(139,92,246,0.3)',tx:'#8b5cf6'},
                              slate:{bg:dark?'rgba(148,163,184,0.08)':'rgba(100,116,139,0.08)',brd:'rgba(148,163,184,0.25)',tx:dark?'#94a3b8':'#64748b'},
                            };
                            const c=cm[st.col]||cm.cyan;
                            return(
                              <div key={i} className="rounded-xl p-3 flex items-center justify-between gap-3"
                                   style={{background:c.bg,border:`1px solid ${c.brd}`}}>
                                <div>
                                  <div className="font-semibold text-sm" style={{color:c.tx}}>{st.label}</div>
                                  <div className="text-xs opacity-65 font-mono mt-0.5">{st.detail}</div>
                                </div>
                                <div className="font-mono font-bold text-sm flex-shrink-0" style={{color:c.tx}}>+{st.val.toFixed(2)}</div>
                              </div>
                            );
                          })}
                        </div>

                        {/* Total S */}
                        <div className={`mt-3 rounded-xl p-3 ${dark?'bg-white/5':'bg-slate-50'}`}>
                          <div className={`text-xs font-semibold mb-1 ${dark?'text-white/45':'text-slate-500'}`}>Total Shielding Constant</div>
                          <div className="font-mono font-black text-base">
                            S = {result.steps.filter(s=>s.col!=='slate').map(s=>s.val.toFixed(2)).join(' + ')} = <span className="text-purple-400">{result.S.toFixed(2)}</span>
                          </div>
                        </div>
                      </div>

                      {/* Action buttons */}
                      <div className="grid grid-cols-4 gap-2">
                        {[
                          {l:copied||'📋 Copy', fn:doCopy, g:'from-slate-600 to-slate-700'},
                          {l:'🖼 PNG',           fn:doPNG,  g:'from-emerald-600 to-emerald-700'},
                          {l:'📄 PDF',           fn:doPDF,  g:'from-red-600 to-red-700'},
                          {l:'🔗 Share',         fn:doShare,g:'from-violet-600 to-violet-700'},
                        ].map(b=>(
                          <button key={b.l} onClick={b.fn}
                            className={`py-2.5 rounded-xl text-white font-semibold text-xs sm:text-sm bg-gradient-to-br ${b.g} hover:opacity-90 transition-all hover:-translate-y-0.5 shadow-md`}>
                            {b.l}
                          </button>
                        ))}
                      </div>
                    </div>
                  ):(
                    <div className={`rounded-2xl p-8 ${card} flex flex-col items-center justify-center text-center min-h-64 anim-fade`}>
                      <div className="text-5xl mb-3 anim-glow">⚗️</div>
                      <h3 className="font-bold text-lg mb-2">Ready to Calculate</h3>
                      <p className={`text-sm max-w-xs ${dark?'text-white/45':'text-slate-500'}`}>
                        Choose an orbital above, then hit <strong>Calculate Z<sub>eff</sub></strong> to see the full Slater's Rules breakdown.
                      </p>
                    </div>
                  )}
                </div>
              </div>
            ):(
              /* Welcome screen */
              <div className={`rounded-2xl p-10 ${card} flex flex-col items-center justify-center text-center anim-fade`}>
                <div className="text-7xl mb-5 anim-glow">⚛️</div>
                <h2 className="font-black text-3xl mb-3 bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                  Welcome to Albert &amp; Einstein
                </h2>
                <p className={`text-base max-w-lg mb-6 ${dark?'text-white/50':'text-slate-500'}`}>
                  Click any element on the periodic table to calculate its Effective Nuclear Charge (Z<sub>eff</sub>) using Slater's Rules — with a full step-by-step explanation.
                </p>
                <div className="flex flex-wrap justify-center gap-3">
                  {[{Z:1,sym:'H',hint:'Hydrogen'},{Z:5,sym:'B',hint:'Boron'},{Z:26,sym:'Fe',hint:'Iron'},{Z:29,sym:'Cu',hint:'Copper'},{Z:79,sym:'Au',hint:'Gold'}].map(q=>(
                    <button key={q.Z}
                      onClick={()=>setSel(ELEMENTS.find(e=>e.Z===q.Z))}
                      className="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-gradient-to-br from-cyan-500/15 to-blue-600/15 border border-cyan-500/25 text-cyan-400 hover:border-cyan-400/50 transition-all hover:-translate-y-0.5 shadow-sm">
                      <span className="font-mono font-black">{q.sym}</span>
                      <span className="text-xs opacity-70">{q.hint}</span>
                    </button>
                  ))}
                </div>
                <p className={`mt-6 text-xs ${dark?'text-white/25':'text-slate-400'}`}>
                  Or use the 🔍 search bar to find any element instantly
                </p>
              </div>
            )}
          </div>
        )}

        {/* ── HISTORY TAB ── */}
        {tab==='history'&&(
          <div className={`rounded-2xl p-5 ${card} anim-fade`}>
            <div className="flex items-center justify-between mb-4">
              <h2 className="font-bold text-lg">Recent Calculations</h2>
              {history.length>0&&(
                <button onClick={()=>setHistory([])}
                  className="text-xs text-red-400 hover:text-red-300 border border-red-500/20 hover:border-red-500/40 px-3 py-1 rounded-lg transition-all">
                  Clear All
                </button>
              )}
            </div>
            {history.length===0?(
              <div className={`text-center py-12 ${dark?'text-white/30':'text-slate-400'}`}>
                <div className="text-4xl mb-3">🕑</div>
                <p>No calculations yet. Calculate Z<sub>eff</sub> for an element to see it here.</p>
              </div>
            ):(
              <div className="hist space-y-2 max-h-96 overflow-y-auto pr-1">
                {history.slice().reverse().map((h,i)=>(
                  <div key={i} className={`rounded-xl p-3 cursor-pointer transition-all hover:-translate-y-0.5 ${dark?'bg-white/5 hover:bg-white/10 border border-white/8':'bg-slate-50 hover:bg-slate-100 border border-slate-100'}`}
                    onClick={()=>{ setSel(h.el); setOrb(h.orb); setResult({Z:h.Z,S:h.S,Zeff:h.Zeff,steps:h.steps,orb:h.orb,el:h.el}); setTab('table'); }}>
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <span className="font-black text-cyan-400 font-mono">{h.sym}</span>
                        <span className={`text-sm ${dark?'text-white/60':'text-slate-600'}`}>{h.name}</span>
                        <span className="text-xs px-2 py-0.5 rounded-md bg-blue-500/20 text-blue-400 font-mono">{h.orb}</span>
                      </div>
                      <div className="font-mono font-bold text-sm text-cyan-300">Zeff = {h.Zeff.toFixed(2)}</div>
                    </div>
                    <div className={`text-xs mt-1 ${dark?'text-white/30':'text-slate-400'}`}>{h.ts}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* ── FAVOURITES TAB ── */}
        {tab==='favorites'&&(
          <div className={`rounded-2xl p-5 ${card} anim-fade`}>
            <h2 className="font-bold text-lg mb-4">Favourite Elements</h2>
            {favEls.length===0?(
              <div className={`text-center py-12 ${dark?'text-white/30':'text-slate-400'}`}>
                <div className="text-4xl mb-3">⭐</div>
                <p>No favourites yet. Click ☆ next to an element to save it here.</p>
              </div>
            ):(
              <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-3">
                {favEls.map(e=>(
                  <div key={e.Z}
                    className={`el c-${e.cat} rounded-xl cursor-pointer transition-all hover:-translate-y-1`}
                    style={{width:'auto',height:'auto',padding:'12px 8px',flexDirection:'column',display:'flex',alignItems:'center',gap:2}}
                    onClick={()=>{ setSel(e); setTab('table'); }}>
                    <span style={{fontSize:11,opacity:.8}}>{e.Z}</span>
                    <span style={{fontSize:22,fontWeight:900}}>{e.sym}</span>
                    <span style={{fontSize:10,opacity:.7,textAlign:'center'}}>{e.name}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* ── FOOTER ── */}
        <footer className={`text-center text-xs py-4 ${dark?'text-white/25':'text-slate-400'}`}>
          Albert &amp; Einstein · Zeff Calculator · Slater's Rules (1930) · All 118 Elements · Built for chemistry students
        </footer>
      </main>
    </div>
  );
}

// Render
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
